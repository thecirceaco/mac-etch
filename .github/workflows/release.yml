name: Build release ZIP

on:
  push:
    tags:
      - 'v*'

permissions: {}

defaults:
  run:
    shell: bash

env:
  ZIP_NAME: mac-etch-${{ github.ref_name }}.zip

jobs:
  verify:
    name: Check tag, version and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag is on main
        run: |
          set -euo pipefail
          commit=$(git rev-parse --verify "${GITHUB_SHA}^{commit}")
          tagged=$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")
          if [[ "$tagged" != "$commit" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to ${tagged}, not to the pushed commit ${commit}."
            exit 1
          fi
          if ! git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null; then
            echo "::error::origin/main was not fetched."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to ${commit}, which is not on main. Push the commit to main, then tag it."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} points to ${commit}, which is on main."

      - name: Check tag matches theme version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag ${tag} is not v followed by a version number, for example v1.2.3."
            exit 1
          fi

          status=0
          check() {
            if [[ "$2" == "$version" ]]; then
              echo "${1}: ${2}"
            else
              echo "::error::${1} is '${2}', but tag ${tag} needs ${version}."
              status=1
            fi
          }

          # Read the Version header the way WordPress does: first match, any case.
          theme_version=$(grep -m 1 -i -E '^[[:blank:]/*#@]*Version:' style.css | sed -E 's/^[^:]*:[[:blank:]]*//; s/[[:blank:]]*(\*\/|\?>).*$//; s/[[:space:]]*$//' || true)
          check "style.css Version" "$theme_version"

          doc_version=$(grep -m 1 -E '^[[:blank:]]*\*[[:blank:]]*@version[[:blank:]]' functions.php | sed -E 's/.*@version[[:blank:]]+//; s/[[:space:]]*$//' || true)
          if [[ -n "$doc_version" ]]; then
            check "functions.php @version" "$doc_version"
          fi

          # MAC_ETCH_VERSION is read from style.css at runtime. If it is ever hard-coded, it must match too.
          while IFS= read -r constant_version; do
            check "MAC_ETCH_VERSION" "$constant_version"
          done < <(git grep -h -o -E "(define\([[:blank:]]*['\"]|const[[:blank:]]+)MAC_ETCH_VERSION['\"]?[[:blank:]]*[,=][[:blank:]]*['\"][^'\"]*['\"]" -- '*.php' | sed -E "s/.*['\"]([^'\"]*)['\"]$/\1/")

          exit "$status"

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPCS
        run: composer lint

  build:
    name: Build ZIP
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    env:
      # Every file the ZIP may contain, relative to the theme folder. To ship a new
      # file, add it here; to keep a file out, mark it export-ignore in .gitattributes.
      SHIPPED_FILES: |
        LICENSE
        assets/css/admin.css
        assets/css/client.css
        assets/css/index.php
        assets/index.php
        functions.php
        inc/constants.php
        inc/theme.php
        index.php
        screenshot.png
        style.css
        theme.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix=mac-etch/ --output="dist/${ZIP_NAME}" "$GITHUB_SHA"

      - name: Check ZIP contents
        run: |
          set -euo pipefail
          entries=$(unzip -Z1 "dist/${ZIP_NAME}")
          if grep -q -v '^mac-etch/' <<< "$entries"; then
            echo "::error::The ZIP has entries outside the mac-etch/ folder."
            exit 1
          fi

          files=$(grep -v '/$' <<< "$entries" | sed 's|^mac-etch/||' | LC_ALL=C sort || true)
          expected=$(grep -v '^$' <<< "$SHIPPED_FILES" | LC_ALL=C sort)
          unexpected=$(LC_ALL=C comm -13 <(echo "$expected") <(echo "$files"))
          missing=$(LC_ALL=C comm -23 <(echo "$expected") <(echo "$files"))
          while IFS= read -r file; do
            [[ -z "$file" ]] || echo "::error::Unexpected file in the ZIP: ${file}"
          done <<< "$unexpected"
          while IFS= read -r file; do
            [[ -z "$file" ]] || echo "::error::Missing file in the ZIP: ${file}"
          done <<< "$missing"
          if [[ -n "$unexpected$missing" ]]; then
            echo "To ship a new file, add it to SHIPPED_FILES in .github/workflows/release.yml. To keep a file out of the ZIP, mark it export-ignore in .gitattributes."
            exit 1
          fi
          echo "The ZIP contains exactly the expected files:"
          echo "$files"

      - name: Record SHA-256
        id: checksum
        run: |
          set -euo pipefail
          sha256=$(sha256sum "dist/${ZIP_NAME}" | cut -d ' ' -f 1)
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "\`${ZIP_NAME}\` SHA-256: \`${sha256}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${ZIP_NAME} SHA-256: ${sha256}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.ZIP_NAME }}

      - name: Upload ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-zip
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-zip
          path: dist

      - name: Check SHA-256
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "${SHA256}  dist/${ZIP_NAME}" | sha256sum --check --strict

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/notes.md" <<EOF
          SHA-256 of \`${ZIP_NAME}\`: \`${SHA256}\`

          Verify the build provenance with \`gh attestation verify ${ZIP_NAME} --repo ${GITHUB_REPOSITORY}\`.
          EOF
          gh release create "$GITHUB_REF_NAME" "dist/${ZIP_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${RUNNER_TEMP}/notes.md"
